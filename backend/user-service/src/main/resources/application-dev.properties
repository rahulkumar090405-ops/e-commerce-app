# Application name
spring.application.name=user-service

# Disable Docker Compose auto-start
spring.docker.compose.enabled=false

# Application HTTP port
server.port=8081

# ==============================
# MYSQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/user_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Local development only. Set JWT_SECRET to override this shared dev key.
jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-outside-local-development-2026}

# Replace these placeholders with Google OAuth credentials to enable Google sign-in.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-development-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-development-client-secret}