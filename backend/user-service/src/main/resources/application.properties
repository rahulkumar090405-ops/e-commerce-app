# Application name
spring.application.name=user-service
spring.profiles.active=dev
# Disable Docker Compose auto-start
spring.docker.compose.enabled=false

# Application HTTP port
server.port=8081

# ==============================
# MYSQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/user_db
spring.datasource.username=${DB_USERNAME:root}

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# JWT Tocken
# =====================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}


# =====================
# OAuth2 Google
# =====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

jwt.issuer=${JWT_ISSUER:http://localhost:8081}

# Short-lived OAuth browser session. JWT APIs ignore this cookie.
server.servlet.session.timeout=5m
server.servlet.session.cookie.name=ECOMMERCE_OAUTH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
