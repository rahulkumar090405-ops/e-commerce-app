
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**

server:
  port: 8084
