<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My E-Commerce Store</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #222;
        }


        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;

            padding: 22px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        .header-right {
            color: #cbd5e1;
            font-size: 14px;
        }


        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 1200px;

            margin: 40px auto;
        }


        /* ================= TITLE ================= */

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #64748b;
            font-size: 14px;
        }


        /* ================= PRODUCT GRID ================= */

        .product-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;
        }


        /* ================= PRODUCT CARD ================= */

        .product-card {

            background: white;

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            transition: 0.2s;

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }


        .product-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12);
        }


        /* ================= PRODUCT IMAGE ================= */

        .product-image {

            height: 150px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #e0e7ff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 55px;

            margin-bottom: 18px;
        }


        /* ================= CATEGORY ================= */

        .category {

            display: inline-block;

            background: #f1f5f9;

            color: #475569;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            margin-bottom: 10px;
        }


        /* ================= PRODUCT NAME ================= */

        .product-card h3 {

            font-size: 20px;

            color: #1e293b;

            margin-bottom: 10px;
        }


        /* ================= PRICE ================= */

        .price {

            font-size: 22px;

            font-weight: bold;

            color: #e67e22;

            margin-bottom: 18px;
        }


        /* ================= BUTTONS ================= */

        .button-container {

            display: flex;

            gap: 10px;
        }


        .btn {

            flex: 1;

            padding: 11px;

            border-radius: 8px;

            text-decoration: none;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s;
        }


        /* View Product */

        .view-btn {

            background: #e2e8f0;

            color: #1e293b;
        }

        .view-btn:hover {

            background: #cbd5e1;
        }


        /* Order */

        .order-btn {

            background: #2563eb;

            color: white;
        }

        .order-btn:hover {

            background: #1d4ed8;
        }


        /* ================= PAGINATION ================= */

        .pagination-section {

            margin-top: 40px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 15px;
        }


        .pagination-info {

            color: #64748b;

            font-size: 14px;
        }


        .pagination {

            display: flex;

            gap: 7px;

            align-items: center;
        }


        .page-btn {

            min-width: 40px;

            height: 40px;

            padding: 0 12px;

            border-radius: 8px;

            border: 1px solid #e2e8f0;

            background: white;

            color: #334155;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s;
        }


        .page-btn:hover {

            background: #eff6ff;

            border-color: #2563eb;

            color: #2563eb;
        }


        /* Current Page */

        .page-btn.active {

            background: #2563eb;

            border-color: #2563eb;

            color: white;
        }


        /* Disabled */

        .page-btn.disabled {

            color: #cbd5e1;

            background: #f8fafc;

            pointer-events: none;
        }


        /* ================= FOOTER ================= */

        footer {

            margin-top: 50px;

            padding: 25px;

            text-align: center;

            background: #0f172a;

            color: #94a3b8;

            font-size: 13px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {

                padding: 20px;
            }

            header h1 {

                font-size: 21px;
            }

            .header-right {

                display: none;
            }

            .container {

                width: 92%;
            }

            .button-container {

                flex-direction: column;
            }

            .pagination {

                flex-wrap: wrap;

                justify-content: center;
            }
        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <h1>🛒 My E-Commerce Store</h1>

    <div class="header-right">
        Spring 6 Microservices
    </div>

</header>



<!-- ================= MAIN ================= -->

<div class="container">


    <!-- TITLE -->

    <div class="page-title">

        <h2>Our Products</h2>

        <p>
            Browse products and place your order
        </p>

    </div>



    <!-- ================= PRODUCTS ================= -->

    <div class="product-grid">


        <!-- PRODUCT CARD -->

        <div class="product-card"
             th:each="product : ${products}">


            <!-- Product Image -->

            <div class="product-image">

                🛍️

            </div>



            <!-- Product Information -->

            <div>

                <span class="category"
                      th:text="${product.category}">

                    Category

                </span>


                <h3 th:text="${product.productName}">

                    Product Name

                </h3>


                <p class="price">

                    ₹<span th:text="${product.price}">
                        500
                    </span>

                </p>

            </div>



            <!-- Buttons -->

            <div class="button-container">


                <!-- VIEW PRODUCT -->

                <a class="btn view-btn"
                   th:href="@{/demo/products/{id}(id=${product.id})}">

                    View Product

                </a>



                <!-- ORDER -->

                <form th:action="@{'http://localhost:8083/orders/' + ${product.id}}" method="post">
    <button type="submit" class="btn order-btn">
        🛒 Order Now
    </button>
</form>

            </div>


        </div>

    </div>



    <!-- ================= PAGINATION ================= -->

    <div class="pagination-section">


        <!-- Total Items -->

        <div class="pagination-info">

            Showing page
            <strong th:text="${currentPage + 1}">
                1
            </strong>

            of

            <strong th:text="${totalPages}">
                5
            </strong>

            |

            Total Products:

            <strong th:text="${totalItems}">
                40
            </strong>

        </div>



        <div class="pagination">


            <!-- PREVIOUS -->

            <a class="page-btn"
               th:classappend="${currentPage == 0} ? ' disabled' : ''"
               th:href="@{/demo/products(
                    page=${currentPage - 1},
                    size=${pageSize}
               )}">

                ← Previous

            </a>



            <!-- PAGE NUMBERS -->

            <a class="page-btn"
               th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == currentPage} ? ' active' : ''"
               th:href="@{/demo/products(
                    page=${pageNumber},
                    size=${pageSize}
               )}">

                1

            </a>



            <!-- NEXT -->

            <a class="page-btn"
               th:classappend="${currentPage + 1 >= totalPages} ? ' disabled' : ''"
               th:href="@{/demo/products(
                    page=${currentPage + 1},
                    size=${pageSize}
               )}">

                Next →

            </a>


        </div>

    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer>

    © 2026 My E-Commerce Store |
    Spring 6 Microservices Project

</footer>


</body>

</html>
