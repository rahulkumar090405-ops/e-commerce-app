<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
</head>

<body>

<h1>Product Details</h1>

<h2 th:text="${product.productName}">
    Product Name
</h2>

<p>
    Category:
    <span th:text="${product.category}">
        Category
    </span>
</p>

<p>
    Description:
    <span th:text="${product.description}">
        Description
    </span>
</p>

<p>
    Price:
    ₹<span th:text="${product.price}">
        0
    </span>
</p>

<a th:href="@{/demo/products}">
    Back to Products
</a>

</body>
</html>
